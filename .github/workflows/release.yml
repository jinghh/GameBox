name: 构建并发布 APK

# 推送 master：构建并更新 latest Release（用户随时能下载最新版）
# 推送 v* 标签：生成带版本号的正式 Release
# 也可在 Actions 页面手动触发
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

# 创建/更新 Release 需要 contents 写权限；其余权限一律不开放
permissions:
  contents: write

# 同一 ref 的连续推送只保留最新一次，避免并发覆盖同一个 Release 附件
concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 静态检查与测试
        run: |
          flutter analyze
          flutter test

      - name: 构建 prod release APK
        run: flutter build apk --flavor prod --release

      - name: 整理产物
        run: mv build/app/outputs/flutter-apk/app-prod-release.apk GameBox.apk

      - name: 计算 Release 标识
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=GameBox $GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=GameBox 最新版（自动构建）" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: |
            Android 安装包（prod release，包名 com.jhh.tank_app）。
            下载 GameBox.apk 后可直接安装；如提示签名不兼容，请先卸载手机上的旧版本。

            构建提交：${{ github.sha }}
          files: GameBox.apk
          overwrite_files: true
